[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiowave"
version = "0.2.0"
description = "Audio waveform widgets, analysis and playback for PySide6."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PRMPSmart", email = "prmpsmart@gmail.com" }]
dependencies = ["numpy>=1.26", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.5", "lameenc>=1.7"]  # lameenc only builds the mp3 test fixtures

[project.scripts]
audiowave-studio = "studio.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audiowave", "studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "studio", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # the formatter owns line length
  "RUF001", "RUF002", "RUF003",  # × − → are deliberate typography in UI text
]

[tool.ruff.lint.per-file-ignores]
"src/audiowave/widgets/painters/__init__.py" = ["F401"]  # side-effect imports register the built-in styles
